<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GR Studio">
<title>GR Studio Beauty</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Barlow+Condensed:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--bg2:#111113;--card:#151517;--card2:#1c1c1f;--line:#2b2720;--gold:#c9a24a;--gold2:#ecd08a;--goldg:linear-gradient(135deg,#8a6a24,#e3c27a 45%,#b8903f);--text:#f3eee5;--muted:#9b9488;--red:#e5675d;--amber:#e5a94b;--green:#62c48b;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:17px;line-height:1.35;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:flex;min-height:100vh}
.side{width:240px;flex-shrink:0;border-right:1px solid var(--line);padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;background:radial-gradient(ellipse at top,#1d180d 0,transparent 65%);overflow-y:auto}
.logo{text-align:center}
.mono{font-family:'Cormorant Garamond',serif;font-size:60px;line-height:.9;font-weight:600;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-3px}
.logo .nm{font-family:'Cormorant Garamond',serif;letter-spacing:3px;font-size:13px;color:var(--gold2);margin-top:8px;font-weight:600}
.logo .sb{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--gold)}
.navl{display:flex;flex-direction:column;gap:3px}
.nb{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:17px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;position:relative;text-align:left}
.nb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nb:hover{color:var(--text);background:var(--card)}
.nb.on{color:var(--gold2);background:linear-gradient(90deg,rgba(201,162,74,.18),transparent)}
.badge{margin-left:auto;background:var(--red);color:#fff;font-size:12px;font-weight:700;font-style:normal;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.badge[hidden]{display:none}
main{flex:1;min-width:0;padding:32px clamp(16px,4vw,48px) 100px;max-width:1240px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.head .btns{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:13px;color:var(--gold)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(30px,4vw,42px);line-height:1.05;text-transform:none}
h1::first-letter{text-transform:uppercase}
h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:23px;margin-bottom:10px;color:var(--gold2);display:flex;align-items:center;gap:10px}
.cnt{font-family:'Barlow Condensed';font-size:13px;background:var(--red);color:#fff;border-radius:10px;padding:0 8px;font-weight:700}
.cnt.z{background:var(--card2);color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--goldg)}
.kpi span{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.kpi b{display:block;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:34px;letter-spacing:1px;margin-top:4px;white-space:nowrap}
.kpi small{color:var(--muted);font-size:14px}
.kpi.neg b{color:var(--red)}.kpi.pos b{color:var(--green)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;letter-spacing:.8px;text-transform:uppercase;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn.gold{background:var(--goldg);color:#1a1408;border:0}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--red);border-color:rgba(229,103,93,.4)}
.btn.wa{background:var(--wa);color:#05290f;border:0}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:active,.ib:active{transform:scale(.96)}
.ag,.cli,.est,.lanc,.al{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.al{justify-content:space-between;gap:10px;padding:10px 0}
.ag-t{width:56px;text-align:center;flex-shrink:0}
.ag-t b{font-family:'Bebas Neue';font-weight:400;font-size:24px;color:var(--gold2);display:block;line-height:1}
.ag-t small{color:var(--muted);font-size:13px}
.ag-i,.cli-i,.est-i{flex:1;min-width:0}
.ag-n{font-weight:600;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ag-s{color:var(--muted);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12px;text-transform:uppercase;letter-spacing:.8px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-weight:600;white-space:nowrap}
.chip.ok,.s-concluido{color:var(--green);border-color:rgba(98,196,139,.4)}
.chip.warn{color:var(--amber);border-color:rgba(229,169,75,.45)}
.chip.bad,.s-cancelado,.s-faltou{color:var(--red);border-color:rgba(229,103,93,.4)}
.chip.gold,.s-confirmado{color:var(--gold2);border-color:rgba(201,162,74,.5)}
.st-cancelado,.st-faltou{opacity:.5}
.ag-a{display:flex;gap:6px;flex-shrink:0}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer;font-size:17px;text-decoration:none;color:var(--text);flex-shrink:0}
.ib.ok{background:rgba(98,196,139,.15);color:var(--green);border-color:rgba(98,196,139,.4)}
.ib.wa{color:var(--wa)}
.av{width:42px;height:42px;border-radius:50%;background:var(--goldg);color:#1a1408;display:grid;place-items:center;font-family:'Cormorant Garamond';font-weight:700;font-size:22px;flex-shrink:0}
.empty{color:var(--muted);padding:14px 0;font-style:italic;border-top:1px solid var(--line)}
.muted{color:var(--muted)}.sm{font-size:14px}
.gold-t{color:var(--gold2)}
.banner{border:1px solid rgba(201,162,74,.35);background:rgba(201,162,74,.07);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:16px}
.search{margin-bottom:14px}
/* agenda */
.week{display:flex;gap:6px;margin-bottom:12px}
.week .nav{width:34px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:22px;color:var(--gold)}
.day{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0;gap:1px}
.day span{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
.day b{font-family:'Bebas Neue';font-weight:400;font-size:24px;line-height:1.1}
.day i{font-style:normal;font-size:11px;background:var(--gold);color:#111;border-radius:8px;padding:0 6px;font-weight:700;min-height:15px}
.day i:empty{background:none}
.day.td b{color:var(--gold2)}
.day.on{background:var(--goldg);border-color:transparent}.day.on span{color:#3a2c10}.day.on b{color:#1a1408}.day.on i{background:#1a1408;color:var(--gold2)}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.tools input{width:auto}
/* serviços */
.srvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.srv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.2s}
.srv:hover{border-color:var(--gold)}
.srv-n{font-weight:600;font-size:19px}
.srv-p{font-family:'Bebas Neue';font-size:32px;color:var(--gold2);line-height:1.2}
/* estoque / financeiro */
.est{flex-wrap:wrap}
.est-i{min-width:170px}
.qty{display:flex;align-items:center;gap:6px}
.qty b{font-family:'Bebas Neue';font-weight:400;font-size:28px;min-width:44px;text-align:center}
.est.lv2 .qty b{color:var(--red)}.est.lv1 .qty b{color:var(--amber)}
.lanc-d{font-family:'Bebas Neue';font-size:20px;color:var(--muted);width:46px;flex-shrink:0}
.lanc>b{font-family:'Bebas Neue';font-weight:400;font-size:22px;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}
.bar{margin-bottom:12px}.bar-h{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}.bar-t{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}.bar-f{height:100%;background:var(--goldg);border-radius:4px}
/* mensagens */
.msg{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--bg2)}
.msg.sent{opacity:.55}
.msg-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.msg-t{white-space:pre-wrap;font-family:system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;color:#d6cfc2;background:var(--card);border-radius:10px;padding:10px 12px;margin:10px 0;border-left:3px solid var(--wa)}
.msg-a{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;gap:6px;margin-bottom:16px}
/* forms */
label{display:grid;gap:5px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:17px;text-transform:none;letter-spacing:0;color:var(--text);width:100%;outline:none;font-family:'Barlow Condensed',system-ui,sans-serif}
textarea{font-family:system-ui,-apple-system,sans-serif;font-size:15px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=date],input[type=time],input[type=month]{color-scheme:dark}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.check{display:flex;align-items:center;gap:10px;text-transform:none;font-size:16px;color:var(--text);letter-spacing:0;cursor:pointer}
label.check input{width:20px;height:20px;accent-color:var(--gold)}
label.btn{display:inline-flex;margin:0;font-size:15px;color:var(--text)}
.sub{border:1px dashed var(--gold);border-radius:12px;padding:12px 12px 0;margin-bottom:12px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
.mfoot .danger{margin-right:auto}
.btns{display:flex;gap:10px;flex-wrap:wrap}
/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.hidden{display:none}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:20px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.mhead h3{font-family:'Cormorant Garamond';font-size:26px;color:var(--gold2);font-weight:600}
.mhead button{background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--card2);border:1px solid var(--gold);color:var(--text);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.topm,.bottom{display:none}
@media(max-width:900px){
 .side{display:none}
 .app{flex-direction:column}
 .topm{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,11,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:20}
 .topm .mono{font-size:34px}
 .topm .nm{font-family:'Cormorant Garamond';letter-spacing:2px;font-size:13px;color:var(--gold2);font-weight:600;line-height:1.1}
 .topm .sb{font-family:'Cormorant Garamond';font-style:italic;color:var(--gold);font-size:15px}
 main{padding:20px 16px 110px}
 .kpis,.kpis.k3{grid-template-columns:1fr 1fr}
 .grid2{grid-template-columns:minmax(0,1fr)}
 .lanc .est-i{min-width:0}
 .lanc>b{font-size:20px}
 .kpi b{font-size:27px}
 .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(17,17,19,.97);border-top:1px solid var(--line);overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;scrollbar-width:none}
 .bottom::-webkit-scrollbar{display:none}
 .bottom .nb{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;min-width:66px;align-items:center;letter-spacing:.3px}
 .bottom .badge{position:absolute;top:0;right:8px;margin:0;font-size:10px;min-width:16px;height:16px}
 .ag,.cli{gap:10px}
}
@media(max-width:380px){.row{grid-template-columns:1fr}.day span{font-size:10px}}
/* login / sync */
.gate{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at top,#241c0c,var(--bg) 60%);display:grid;place-items:center;padding:20px;overflow:auto}
.gate.hidden{display:none}
.gbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px}
.gbox .logo{margin-bottom:22px}.gbox .mono{font-size:76px}
.gbox .btn{width:100%}
.ginfo{color:var(--green);font-size:15px;margin-bottom:10px}
.gerr{color:var(--red);font-size:15px;min-height:20px;margin-bottom:10px}
.glink{display:block;text-align:center;margin-top:14px;color:var(--muted);font-size:14px;cursor:pointer;background:none;border:0;width:100%}
#sync{position:fixed;top:10px;right:12px;z-index:40;font-size:13px;letter-spacing:.5px;padding:3px 10px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
#sync.ok{color:var(--green)}#sync.error{color:var(--red);border-color:rgba(229,103,93,.5)}
body.locked .app,body.locked .bottom,body.locked #sync{display:none}
.side .sair{margin-top:auto}
@media(max-width:900px){#sync{font-size:11px;padding:2px 8px;top:6px;right:8px}}
</style>
</head>
<body class="locked">
<div class="app">
 <aside class="side">
  <div class="logo"><div class="mono">GR</div><div class="nm">GABRIELA RIBEIRO</div><div class="sb">Studio Beauty</div></div>
  <nav class="navl" id="navSide"></nav>
  <button class="btn ghost sm sair" onclick="sair()">Sair</button>
 </aside>
 <header class="topm"><div class="mono">GR</div><div><div class="nm">GABRIELA RIBEIRO</div><div class="sb">Studio Beauty</div></div></header>
 <main id="view"></main>
</div>
<nav class="bottom" id="navBottom"></nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="mbox"><div class="mhead"><h3 id="mtitle"></h3><button type="button" onclick="closeModal()" aria-label="Fechar">✕</button></div><div id="mbody"></div></div></div>
<div id="toast"></div>
<div id="sync" class="ok">☁ Salvo</div>
<div id="gate" class="gate hidden"></div>

<script>
/* ============ UTIL ============ */
const KEY='gr_studio_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const brDate=s=>s?String(s).split('-').reverse().join('/'):'';
const money=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WEEK=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const weekday=s=>WEEK[parse(s).getDay()];
const tmin=h=>{const[a,b]=(h||'0:0').split(':').map(Number);return(a||0)*60+(b||0)};
const fone=t=>{const d=String(t||'').replace(/\D/g,'');if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return t||''};
const idade=n=>{if(!n)return'';const t=new Date(),d=parse(n);let i=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))i--;return i};
const byTime=(a,b)=>(a.hora||'').localeCompare(b.hora||'');
const byDT=(a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora);
const empty=m=>`<div class="empty">${m}</div>`;
const nomeMes=s=>parse(s).toLocaleDateString('pt-BR',{month:'long'});

const STATUS={agendado:'Agendado',confirmado:'Confirmado',concluido:'Concluído',cancelado:'Cancelado',faltou:'Faltou'};
const ATIVO=s=>s==='agendado'||s==='confirmado';
const PAGS=['PIX','Dinheiro','Cartão de débito','Cartão de crédito','Outro'];
const CATS=['Produtos / Material','Aluguel','Energia / Água','Internet / Telefone','Marketing / Anúncios','Cursos','Taxas / Maquininha','Pró-labore','Outros'];
const LBL={lembrete:'Lembrete de horário',sinal:'Cobrança do sinal',manutencao:'Lembrete de manutenção',aniversario:'Aniversário'};
const TPL={
 lembrete:'Olá, {nome}! 💛\nPassando para lembrar do seu horário no {studio}:\n\n✨ {servico}\n📅 {dia_semana}, {data}\n⏰ {hora}\n📍 {endereco}\n\nQualquer imprevisto, me avise com antecedência, combinado? Te espero! 🥰',
 sinal:'Olá, {nome}! 💛\nPara confirmar seu horário de *{servico}* no dia {data} às {hora}, é necessário o pagamento do sinal de *{sinal}*.\n\n🔑 Chave PIX: {pix}\n\nAssim que pagar, me envie o comprovante por aqui. O valor é abatido no dia do atendimento. ✨',
 manutencao:'Oi, {nome}! ✨\nJá está chegando a hora da manutenção do seu *{servico}* (ideal até {data}).\n\nVamos garantir seu horário? Me chama aqui que te passo os horários disponíveis! 💛\n{studio}',
 aniversario:'Feliz aniversário, {nome}! 🎉💛\nQue seu novo ciclo seja lindo, leve e cheio de conquistas.\nUm beijo enorme de toda equipe do {studio}! ✨'
};
const SRV_PADRAO=[
 {nome:'Design de sobrancelhas',preco:45,duracao:40,sinal:0,manutDias:20},
 {nome:'Design com henna',preco:60,duracao:50,sinal:0,manutDias:20},
 {nome:'Brow lamination',preco:130,duracao:70,sinal:30,manutDias:45},
 {nome:'Lash lifting',preco:130,duracao:70,sinal:30,manutDias:45},
 {nome:'Extensão de cílios · Fio a fio',preco:150,duracao:120,sinal:40,manutDias:20},

const COLS=['servicos','clientes','agendamentos','estoque','lancamentos'];
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
function normalize(d){
 const base=defaultDB(),o={...base,...d},c=(d&&d.config)||{};
 o.config={...base.config,...c,tpl:{...TPL,...(c.tpl||{})}};
 for(const k of COLS)if(!Array.isArray(o[k]))o[k]=[];
 o.enviados=o.enviados||{};o.ultimoBackup=o.ultimoBackup||'';
 return o;

function flatten(){

 m['config:main']=canon({config:db.config,ultimoBackup:db.ultimoBackup});

function fromRows(rows){

 d.config=cf&&cf.config;d.ultimoBackup=(cf&&cf.ultimoBackup)||'';d.enviados=en||{};
 d.servicos.sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));
 return normalize(d);

async function flush(){

 if(syncing){again=true;return}

 try{
  do{
   again=false;
   const cur=flatten(),up=[],del=[];
   for(const k in cur)if(snap[k]!==cur[k])up.push({chave:k,colecao:k.split(':')[0],dados:JSON.parse(cur[k])});

   for(let i=0;i<up.length;i+=200){const{error}=await sb.from('registros').upsert(up.slice(i,i+200),{onConflict:'chave'});if(error)throw error}
   for(let i=0;i<del.length;i+=100){const{error}=await sb.from('registros').delete().in('chave',del.slice(i,i+100));if(error)throw error}
   up.forEach(r=>snap[r.chave]=cur[r.chave]);del.forEach(k=>delete snap[k]);
  }while(again);

function filaMensagens(){
 const t=today(),amanha=addDays(t,1),out=[];
 for(const a of db.agendamentos){
  if(!ATIVO(a.status))continue;
  const c=cli(a.clienteId);
  if(a.data===t||a.data===amanha)out.push({tipo:'lembrete',key:'lemb-'+a.id,ag:a,cliente:c,quando:a.data===t?'Hoje':'Amanhã'});
  if(+a.sinal>0&&!a.sinalPago&&a.data>=t)out.push({tipo:'sinal',key:'sinal-'+a.id,ag:a,cliente:c,quando:brDate(a.data)});
 }
 const lim=+db.config.antecedenciaManut||0;
 for(const c of db.clientes){
  const feitos=db.agendamentos.filter(a=>a.clienteId===c.id&&a.status==='concluido'&&+srv(a.servicoId).manutDias>0).sort(byDT);
  if(!feitos.length)continue;
  const u=feitos[feitos.length-1],due=addDays(u.data,+srv(u.servicoId).manutDias);
  if(db.agendamentos.some(a=>a.clienteId===c.id&&ATIVO(a.status)&&a.data>=u.data))continue;
  const falta=diffDays(t,due);
  if(falta<=lim&&falta>=-60)out.push({tipo:'manutencao',key:'manut-'+u.id,ag:u,cliente:c,due,falta,quando:falta<0?`venceu há ${-falta} dia(s)`:falta===0?'vence hoje':`faltam ${falta} dia(s)`});
 }
 for(const c of db.clientes)if(c.nasc&&c.nasc.slice(5)===t.slice(5))out.push({tipo:'aniversario',key:`aniv-${c.id}-${t.slice(0,4)}`,cliente:c,quando:'Hoje'});
 return out;
}

function salvarAg(e,id){
 e.preventDefault();const f=new FormData(e.target),g=k=>String(f.get(k)||'').trim();
 const a={id:id||uid(),clienteId:g('clienteId'),servicoId:g('servicoId'),data:g('data'),hora:g('hora'),valor:+g('valor')||0,sinal:+g('sinal')||0,sinalPago:f.get('sinalPago')==='on',status:g('status')||'agendado',pagamento:g('pagamento'),obs:g('obs')};
 if(a.clienteId==='__novo'&&!g('nNome')){toast('Informe o nome da nova cliente');return}
 if(ATIVO(a.status)){
  const ini=tmin(a.hora),fim=ini+(+srv(a.servicoId).duracao||60);
  const conf=db.agendamentos.find(x=>x.id!==a.id&&x.data===a.data&&ATIVO(x.status)&&tmin(x.hora)<fim&&tmin(x.hora)+(+srv(x.servicoId).duracao||60)>ini);
  if(conf&&!confirm(`Conflito: ${cli(conf.clienteId).nome} já está às ${conf.hora} (${srv(conf.servicoId).nome}). Agendar mesmo assim?`))return;
 }
 if(a.clienteId==='__novo'){const c={id:uid(),nome:g('nNome'),tel:g('nTel'),nasc:g('nNasc'),obs:'',criado:today()};db.clientes.push(c);a.clienteId=c.id}

let finMes=today().slice(0,7);
function bars(o){const e=Object.entries(o).sort((a,b)=>b[1]-a[1]),t=e.reduce((s,x)=>s+x[1],0);return e.length?e.map(([k,v])=>`<div class="bar"><div class="bar-h"><span>${esc(k)}</span><b>${money(v)}</b></div><div class="bar-t"><div class="bar-f" style="width:${t?v/t*100:0}%"></div></div></div>`).join(''):empty('Sem dados no mês.')}
function vFinanceiro(){
 const {rec,desp,luc}=totais(finMes),t=today();
 const l=db.lancamentos.filter(x=>String(x.data).startsWith(finMes)).sort((a,b)=>b.data.localeCompare(a.data));
 const previsto=db.agendamentos.filter(a=>a.data.startsWith(finMes)&&a.data>=t&&ATIVO(a.status)).reduce((s,a)=>s+(+a.valor||0)-(a.sinalPago?+a.sinal||0:0),0);
 const feitos=db.agendamentos.filter(a=>a.data.startsWith(finMes)&&a.status==='concluido');
 const ticket=feitos.length?feitos.reduce((s,a)=>s+(+a.valor||0),0)/feitos.length:0;
 const cats={},pags={};
 l.forEach(x=>{if(x.tipo==='despesa'){const k=x.cat||'Outros';cats[k]=(cats[k]||0)+(+x.valor||0)}else{const k=x.pag||'Não informado';pags[k]=(pags[k]||0)+(+x.valor||0)}});
 const marg=rec?Math.round(luc/rec*100):0;
 return`<div class="head"><div><div class="eyebrow">Financeiro</div><h1>${parse(finMes+'-01').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h1></div><div class="btns"><button class="btn ghost" onclick="formLanc('receita')">+ Receita</button><button class="btn gold" onclick="formLanc('despesa')">+ Despesa</button></div></div>
 <div class="tools"><input type="month" value="${finMes}" onchange="if(this.value){finMes=this.value;render()}"><button class="btn ghost sm" onclick="exportXlsx('mes')">⬇ Excel do mês</button><button class="btn ghost sm" onclick="exportXlsx('tudo')">⬇ Excel completo</button></div>
 <div class="kpis">
  <div class="kpi"><span>Faturamento</span><b>${money(rec)}</b></div>
  <div class="kpi"><span>Despesas</span><b>${money(desp)}</b></div>
  <div class="kpi ${luc<0?'neg':'pos'}"><span>Lucro líquido</span><b>${money(luc)}</b><small>margem ${marg}%</small></div>
  <div class="kpi"><span>A receber (agendado)</span><b>${money(previsto)}</b></div>
 </div>
 <div class="grid2">
  <div class="card"><h2>Lançamentos</h2>${l.length?l.map(x=>`<div class="lanc"><div class="lanc-d">${brDate(x.data).slice(0,5)}</div><div class="est-i"><div class="ag-n" style="font-size:16px">${esc(x.desc)}</div><div class="ag-s">${esc(x.cat||'')}${x.pag?' · '+esc(x.pag):''}${x.agId?' · via agenda':''}</div></div><b class="${x.tipo==='receita'?'pos':'neg'}">${x.tipo==='receita'?'+':'−'} ${money(x.valor)}</b>${x.agId?'':`<button class="ib" title="Excluir" onclick="delLanc('${x.id}')">✕</button>`}</div>`).join(''):empty('Nenhum lançamento neste mês.')}</div>
  <div>
   <div class="card"><h2>Atendimentos</h2><div class="al"><span>Concluídos no mês</span><b>${feitos.length}</b></div><div class="al"><span>Ticket médio</span><b>${money(ticket)}</b></div></div>
   <div class="card"><h2>Despesas por categoria</h2>${bars(cats)}</div>
   <div class="card"><h2>Recebido por forma de pagamento</h2>${bars(pags)}</div>
  </div>
 </div>`;
}
function formLanc(tipo){openModal(tipo==='despesa'?'Nova despesa':'Nova receita',`<form onsubmit="salvarLanc(event,'${tipo}')"><label>Descrição<input name="desc" required placeholder="${tipo==='despesa'?'Ex.: Aluguel da sala':'Ex.: Venda de sérum'}"></label>
 <div class="row"><label>Valor (R$)<input type="number" step="0.01" min="0" name="valor" required></label><label>Data<input type="date" name="data" value="${today()}" required></label></div>
 ${tipo==='despesa'?`<label>Categoria<select name="cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>`:`<div class="row"><label>Categoria<select name="cat"><option>Venda de produto</option><option>Atendimento avulso</option><option>Curso / Mentoria</option><option>Outros</option></select></label><label>Pagamento<select name="pag">${PAGS.map(p=>`<option>${p}</option>`).join('')}</select></label></div>`}
 <div class="mfoot"><button class="btn gold">Lançar</button></div></form>`)}
function salvarLanc(e,tipo){e.preventDefault();const f=new FormData(e.target);db.lancamentos.push({id:uid(),tipo,desc:String(f.get('desc')).trim(),valor:+f.get('valor')||0,data:f.get('data'),cat:f.get('cat')||'',pag:f.get('pag')||''});save();closeModal();toast('Lançamento registrado ✓');render()}
function delLanc(id){if(!confirm('Excluir este lançamento?'))return;db.lancamentos=db.lancamentos.filter(l=>l.id!==id);save();render()}


function exportXlsx(modo){
 if(typeof XLSX==='undefined'){toast('Biblioteca do Excel não carregou — verifique a internet');return}
 const R='"R$" #,##0.00',D='dd/mm/yyyy';
 const inr=d=>modo==='tudo'||String(d).startsWith(finMes);
 const ser=s=>{const[y,m,d]=String(s).split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5)};
 const L=db.lancamentos.filter(l=>inr(l.data)).sort((a,b)=>a.data.localeCompare(b.data));
 const wb=XLSX.utils.book_new();
 const mk=(aoa,w)=>{const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=w.map(x=>({wch:x}));return ws};
 const fmt=(ws,col,z)=>{const r=XLSX.utils.decode_range(ws['!ref']);for(let i=1;i<=r.e.r;i++){const c=ws[XLSX.utils.encode_cell({r:i,c:col})];if(c)c.z=z}};
 /* resumo mensal */
 const meses=[...new Set(L.map(l=>l.data.slice(0,7)))].sort();
 const res=[['Mês','Faturamento','Despesas','Lucro líquido','Margem']];
 meses.forEach(m=>{const t=totais(m);res.push([m.split('-').reverse().join('/'),t.rec,t.desp,0,0])});
 const n=meses.length;res.push(['TOTAL',0,0,0,0]);
 const ws1=mk(res,[12,16,16,16,10]);
 for(let i=0;i<=n;i++){
  const r=i+2,tot=i===n,rec=tot?meses.reduce((s,m)=>s+totais(m).rec,0):totais(meses[i]).rec,des=tot?meses.reduce((s,m)=>s+totais(m).desp,0):totais(meses[i]).desp;
  if(tot){ws1['B'+r]={t:'n',v:rec,f:`SUM(B2:B${n+1})`,z:R};ws1['C'+r]={t:'n',v:des,f:`SUM(C2:C${n+1})`,z:R}}
  else{ws1['B'+r].z=R;ws1['C'+r].z=R}
  ws1['D'+r]={t:'n',v:rec-des,f:`B${r}-C${r}`,z:R};
  ws1['E'+r]={t:'n',v:rec?(rec-des)/rec:0,f:`IF(B${r}=0,0,D${r}/B${r})`,z:'0%'};
 }
 XLSX.utils.book_append_sheet(wb,ws1,'Resumo');
 /* lançamentos */
 const ws2=mk([['Data','Tipo','Descrição','Categoria','Pagamento','Valor (R$)'],...L.map(l=>[ser(l.data),l.tipo==='receita'?'Receita':'Despesa',l.desc,l.cat||'',l.pag||'',+l.valor||0])],[12,10,44,22,18,16]);
 fmt(ws2,0,D);fmt(ws2,5,R);ws2['!autofilter']={ref:ws2['!ref']};
 XLSX.utils.book_append_sheet(wb,ws2,'Lançamentos');
 /* atendimentos */
 const A=db.agendamentos.filter(a=>inr(a.data)).sort(byDT);
 const ws3=mk([['Data','Hora','Cliente','Serviço','Valor (R$)','Sinal (R$)','Sinal pago','Status','Pagamento'],...A.map(a=>[ser(a.data),a.hora,cli(a.clienteId).nome,srv(a.servicoId).nome,+a.valor||0,+a.sinal||0,+a.sinal>0?(a.sinalPago?'Sim':'Não'):'',STATUS[a.status]||a.status,a.pagamento||''])],[12,8,28,36,14,14,11,13,18]);
 fmt(ws3,0,D);fmt(ws3,4,R);fmt(ws3,5,R);ws3['!autofilter']={ref:ws3['!ref']};
 XLSX.utils.book_append_sheet(wb,ws3,'Atendimentos');
 /* despesas por categoria */
 const cats={};L.filter(l=>l.tipo==='despesa').forEach(l=>{const k=l.cat||'Outros';cats[k]=(cats[k]||0)+(+l.valor||0)});
 const ws4=mk([['Categoria','Total (R$)'],...Object.entries(cats).sort((a,b)=>b[1]-a[1])],[30,16]);fmt(ws4,1,R);
 XLSX.utils.book_append_sheet(wb,ws4,'Despesas por categoria');
 XLSX.writeFile(wb,`financeiro-gr-studio-${modo==='tudo'?'completo':finMes}.xlsx`);
 toast('Excel gerado ✓');
}

/* ============ MENSAGENS ============ */
let verEnviadas=false;
function msgCard(i){
 const sent=db.enviados[i.key],a=i.ag;
 const det=i.tipo==='aniversario'?`Completa ${idade(i.cliente.nasc)} anos hoje 🎂`:i.tipo==='manutencao'?`${esc(srv(a.servicoId).nome)} feito em ${brDate(a.data)} · ${i.quando}`:`${esc(srv(a.servicoId).nome)} · ${i.quando}${i.tipo==='lembrete'?' às '+esc(a.hora):''}${i.tipo==='sinal'?' · sinal '+money(a.sinal):''}`;
 return`<div class="msg ${sent?'sent':''}"><div class="msg-h"><div><div class="ag-n">${esc(i.cliente.nome)}</div><div class="ag-s">${det}${i.cliente.tel?'':' · <span class="neg">sem telefone</span>'}</div></div>${sent?'<span class="chip ok">Enviada</span>':''}</div>
 <div class="msg-t">${esc(montar(i))}</div>
 <div class="msg-a">${sent?`<button class="btn ghost sm" onclick="marcar('${i.key}',false)">Desfazer</button>`:`<button class="btn wa sm" onclick="enviar('${i.key}')">Enviar no WhatsApp</button><button class="btn ghost sm" onclick="marcar('${i.key}',true)">Já enviei</button>`}
 ${i.tipo==='sinal'?`<button class="btn ghost sm" onclick="marcarSinal('${a.id}')">Marcar sinal pago</button>`:''}${i.tipo==='manutencao'?`<button class="btn ghost sm" onclick="formAg(null,'${i.cliente.id}')">Agendar</button>`:''}</div></div>`;
}
function vMensagens(){
 const all=filaMensagens(),pend=all.filter(i=>!db.enviados[i.key]),show=verEnviadas?all:pend;
 const G=[['lembrete','Lembrete de horário','Clientes com horário hoje ou amanhã'],['sinal','Sinal pendente','Agendamentos com sinal ainda não pago'],['manutencao','Manutenção','Clientes chegando na data ideal de manutenção e sem horário marcado'],['aniversario','Aniversário','Aniversariantes de hoje']];
 return`<div class="head"><div><div class="eyebrow">Mensagens automáticas</div><h1>${pend.length?pend.length+' para enviar hoje':'Tudo em dia ✓'}</h1></div></div>
 <div class="banner">As mensagens são geradas sozinhas todos os dias a partir da agenda e das clientes. Toque em <b>Enviar no WhatsApp</b> e o texto já abre pronto na conversa da cliente — é só apertar enviar. Os textos podem ser editados em <b>Ajustes</b>.</div>
 <div class="toggle"><button class="btn sm ${verEnviadas?'ghost':'gold'}" onclick="verEnviadas=false;render()">Pendentes</button><button class="btn sm ${verEnviadas?'gold':'ghost'}" onclick="verEnviadas=true;render()">Todas</button></div>
 ${G.map(([t,ti,sub])=>{const it=show.filter(i=>i.tipo===t),n=pend.filter(i=>i.tipo===t).length;return`<div class="card"><h2>${ti} <span class="cnt ${n?'':'z'}">${n}</span></h2><p class="muted sm">${sub}</p>${it.length?it.map(msgCard).join(''):empty('Nada por aqui ✓')}</div>`}).join('')}`;
}

/* ============ AJUSTES ============ */
function vAjustes(){const c=db.config;return`<div class="head"><div><div class="eyebrow">Ajustes</div><h1>Configurações</h1></div></div>
 <form class="card" onsubmit="salvarCfg(event)"><h2>Dados do studio</h2>
 <div class="row"><label>Nome do studio<input name="studio" value="${esc(c.studio)}"></label><label>Profissional<input name="profissional" value="${esc(c.profissional)}"></label></div>
 <div class="row"><label>Chave PIX (cobrança do sinal)<input name="pix" value="${esc(c.pix)}" placeholder="CPF, celular, e-mail ou chave aleatória"></label><label>Endereço<input name="endereco" value="${esc(c.endereco)}"></label></div>
 <label>Lembrar manutenção com quantos dias de antecedência<input type="number" min="0" name="antecedenciaManut" value="${c.antecedenciaManut}"></label>
 <h2 style="margin-top:10px">Textos das mensagens</h2><p class="muted sm" style="margin-bottom:12px">Campos automáticos: {nome} {servico} {data} {dia_semana} {hora} {valor} {sinal} {pix} {studio} {endereco} {profissional} · *texto* fica em negrito no WhatsApp</p>
 ${Object.keys(LBL).map(k=>`<label>${LBL[k]}<textarea name="tpl_${k}" rows="6">${esc(c.tpl[k])}</textarea></label>`).join('')}
 <div class="mfoot"><button type="button" class="btn ghost" onclick="restaurarTpl()">Restaurar textos padrão</button><button class="btn gold">Salvar ajustes</button></div></form>
 <div class="card"><h2>Conta</h2><p class="muted sm" style="margin-bottom:14px">Conectada como <b>${esc(session&&session.user?session.user.email:'')}</b>. Para criar outro acesso, use o painel do Supabase (Authentication → Users).</p><div class="btns"><button class="btn ghost" onclick="formSenha()">Trocar senha</button><button class="btn danger" onclick="sair()">Sair</button></div></div>
 <div class="card"><h2>Backup dos dados</h2><p class="muted sm" style="margin-bottom:14px">Seus dados ficam salvos na nuvem e aparecem em qualquer aparelho onde você entrar. O backup é uma cópia extra de segurança.${db.ultimoBackup?' Último backup: '+brDate(db.ultimoBackup)+'.':''}</p>
 <div class="btns"><button class="btn gold" onclick="exportar()">Baixar backup</button><label class="btn ghost">Restaurar backup<input type="file" accept=".json,application/json" hidden onchange="importar(this)"></label><button class="btn danger" onclick="zerar()">Apagar tudo</button></div></div>`}
function salvarCfg(e){e.preventDefault();const f=new FormData(e.target),c=db.config;['studio','profissional','pix','endereco'].forEach(k=>c[k]=String(f.get(k)||'').trim());c.antecedenciaManut=+f.get('antecedenciaManut')||0;Object.keys(LBL).forEach(k=>c.tpl[k]=String(f.get('tpl_'+k)||''));save();toast('Ajustes salvos ✓');render()}
function restaurarTpl(){if(!confirm('Voltar os textos das mensagens ao padrão?'))return;db.config.tpl={...TPL};save();render();toast('Textos restaurados')}
function exportar(){db.ultimoBackup=today();save();const b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`backup-gr-studio-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Backup baixado ✓');render()}
function importar(inp){const file=inp.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.clientes)||!Array.isArray(d.agendamentos))throw 0;if(!confirm('Substituir TODOS os dados atuais pelos do backup?'))return;db=normalize(d);save();render();toast('Backup restaurado ✓')}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(file);inp.value=''}
function zerar(){if(prompt('Isso apaga TODOS os dados deste aparelho. Digite APAGAR para confirmar:')!=='APAGAR')return;db=defaultDB();save();render();toast('Dados apagados')}

/* ============ MODAL / TOAST ============ */
function openModal(t,h){document.getElementById('mtitle').textContent=t;document.getElementById('mbody').innerHTML=h;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('mbody').innerHTML=''}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
window.addEventListener('focus',refresh);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ============ INÍCIO ============ */
boot();
</script>
